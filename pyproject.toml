[project]
name = "prescryb"
version = "0.1.0"
description = "MCP server for CVE/config remediation orchestration: SSH inventory, OSV/NVD lookups, CIS/DISA STIG-mapped Ansible playbook suggestions."
readme = "README.md"
authors = [
    { name = "Thomas Sjögren", email = "konstruktoid@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "paramiko>=5.0.0",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
prescryb = "prescryb.server:main"

[project.optional-dependencies]
test = [
    "numpy>=2.0.0",
    "pytest>=8.0.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format's trailing-comma handling
    "CPY001", # project does not use per-file copyright headers
    "D203",   # incompatible with D211 (no-blank-line-before-class), which we use instead
    "D213",   # incompatible with D212 (multi-line-summary-first-line), which we use instead
]

[tool.ruff.lint.pylint]
# ssh.connect() and inventory_host mirror `ssh`'s own CLI flags, which exceed the 5-arg cap.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D103",   # test names document intent
    "S101",   # assert is pytest's assertion mechanism
    "SLF001", # tests exercise module-private helpers deliberately
]
